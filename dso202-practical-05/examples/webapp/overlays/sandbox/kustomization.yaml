apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Challenge extension: the only overlay with a namePrefix. Every name the
# prefix changes, and every reference to those names, is rewritten together.
namePrefix: sandbox-
namespace: webapp-sandbox

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: sandbox
    includeSelectors: false
    includeTemplates: true
