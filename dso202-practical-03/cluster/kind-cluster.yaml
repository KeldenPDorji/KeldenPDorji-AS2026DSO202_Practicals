# =============================================================================
# File        : cluster/kind-cluster.yaml
# Practical   : DSO202 Practical 3
# Purpose     : Three-node cluster for the Kustomize practical. No host mounts
#               and no port mappings are needed: the application is reached
#               with 'kubectl port-forward', and all state lives in ConfigMaps.
# Apply with  : kind create cluster --config cluster/kind-cluster.yaml
# Delete with : kind delete cluster --name dso202-p3
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# A different name from Practicals 1 and 2, so the clusters can be told apart.
# The kubectl context becomes kind-dso202-p3.
name: dso202-p3

networking:
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

nodes:
  # Node names match the lab topology in the handout: control-plane,
  # worker-node-1, worker-node-2.
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2
