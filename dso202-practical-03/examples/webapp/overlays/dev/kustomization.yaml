apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-dev

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
    includeTemplates: true

replicas:
  - name: webapp
    count: 1

# Dev trials the next NGINX minor before it is promoted.
images:
  - name: nginx
    newTag: 1.31-alpine

configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html
