# Base Deployment. Written once; every overlay reuses it unchanged.
# Environment-specific values (namespace, replicas, image tag, resources,
# page content, labels) are NOT set here - overlays own them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  annotations:
    training.example.com/course: dso202
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            # Logical name. Kustomize rewrites this to the generated,
            # hash-suffixed name (web-content-<hash>) at render time.
            name: web-content
